name: ci

# Checks the content with the engine: byjoba-web's content tests, then a
# build. Invalid content fails here, before it can reach master.

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The engine: the public byjoba-web's generator at main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jonasbarsten/byjoba-web
          ref: main
          path: generator
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - run: CONTENT_DIR=content node --test generator/site/test/content.test.mjs
      - run: node generator/site/build.mjs --content content --out dist
